name: Build Folia iPad unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipad.yml'
      - 'capacitor.config.ts'
      - 'ios-package.json'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4
      - name: Checkout Folia source
        uses: actions/checkout@v4
        with:
          repository: chthollyphile/folia-major
          ref: main
          path: folia
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build bundled Folia frontend
        run: |
          set -euo pipefail
          cd folia
          npm install --no-audit --no-fund
          npx vite build
          test -f dist/index.html
      - name: Create native iPad wrapper
        run: |
          set -euo pipefail
          mkdir -p shell/www
          cp -R folia/dist/. shell/www/
          cp ios-package.json shell/package.json
          cp capacitor.config.ts shell/capacitor.config.ts
          cd shell
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned app
        run: |
          set -euo pipefail
          cd shell
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build build CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.0 TARGETED_DEVICE_FAMILY=2
      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find shell/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$APP"
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry ../Folia-iPad-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Folia-iPad-unsigned
          path: Folia-iPad-unsigned.ipa
